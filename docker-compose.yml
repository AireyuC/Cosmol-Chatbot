services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    container_name: cosmol_n8n
    restart: unless-stopped
    networks:
      - cosmol_network
    environment:
      - N8N_PROXY_HOPS=1
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cosmol_backend
    networks:
      - cosmol_network
    environment:
      - TZ=${GENERIC_TIMEZONE:-America/La_Paz}
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: [ "CMD-SHELL", "php -r \"exit(@fsockopen('localhost', 80) ? 0 : 1);\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: cosmol_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=${GENERIC_TIMEZONE:-America/La_Paz}
      - PGTZ=${GENERIC_TIMEZONE:-America/La_Paz}
    networks:
      - cosmol_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    container_name: cosmol_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public/uploads:/var/www/html/uploads
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cosmol_network
    depends_on:
      - n8n

networks:
  cosmol_network:
    driver: bridge
    name: cosmol_internal_network

volumes:
  n8n_data:
    name: cosmol_n8n_data
  postgres_data:
    name: cosmol_postgres_data
  caddy_data:
    name: cosmol_caddy_data
  caddy_config:
    name: cosmol_caddy_config
