services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    container_name: cosmol_n8n
    ports:
      - "5678:5678"
    networks:
      - cosmol_network
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cosmol_backend
    networks:
      - cosmol_network
    ports:
      - "8000:80"
    profiles:
      - dev
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('localhost', 80) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      
  db:
    image: postgres:16-alpine
    container_name: cosmol_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cosmol_network:
    driver: bridge
    name: cosmol_internal_network

volumes:
  n8n_data:
    name: cosmol_n8n_data
  postgres_data:
    name: cosmol_postgres_data
