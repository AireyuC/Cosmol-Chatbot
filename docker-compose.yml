services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    container_name: cosmol_n8n
    ports:
      - "5678:5678"
    networks:
      - cosmol_network
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n

  # API (PHP 7.3 + Apache)
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cosmol_php_backend
    networks:
      - cosmol_network
    ports:
      - "8000:80"
    profiles:
      - dev
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('localhost', 80) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # Base de Datos (MySQL 5.7)
  db:
    image: mysql:5.7
    container_name: cosmol_mysql
    networks:
      - cosmol_network
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cosmol_network:
    driver: bridge
    name: cosmol_internal_network

volumes:
  n8n_data:
    name: cosmol_n8n_data
  mysql_data:
    name: cosmol_mysql_data
